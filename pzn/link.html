<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Link</title>
    <style>
      div {
        margin: 20px;
      }

      a {
        padding: 4px 6px;
        background-color: antiquewhite;
        text-decoration: none;
        color: black;
        border-radius: 3px;
        box-shadow: 0 0 2px;
        margin-right: 10px;
        font-size: large;
        font-family: sans-serif;
      }

      /* abis di kunjungi */
      a:visited {
        background-color: blue;
        color: white;
      }

      a:hover {
        background-color: rgb(97, 89, 77);
        color: white;
      }
    </style>
  </head>
  <body>
    <div>
      <a href="https://github.com/pian17-ai">GitHub</a>
      <a href="https://instagram.com/pian_chy">Instagram</a>
      <a href="https://reddit.com/pian">Reddit</a>
    </div>
  </body>
</html>
