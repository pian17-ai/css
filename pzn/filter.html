<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Filter</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }

      .container {
        position: relative;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .container::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image: url(images/yui.jpg);
        background-size: 850px;
        filter: blur(5px);
        z-index: -1;
      }

      h1 {
        color: white;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Hello World</h1>
    </div>
  </body>
</html>
