<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Font</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playwrite+NZ+Basic+Guides&display=swap"
      rel="stylesheet"
    />
    <style>
      h1 {
        text-align: center;
        font-weight: bold;
        font-size: 400%;
        margin-top: -15px;
        margin-bottom: -20px;
      }

      p {
        font-family: "Playwrite NZ Basic Guides", cursive;
        font-weight: 400;
        font-style: normal;
        font-weight: bolder;
        font-style: italic;
      }
    </style>
  </head>

  <body>
    <h1>The Title</h1>
    <p>
      Lorem ipsum dolor sit amet consectetur adipisicing elit. Autem eveniet
      temporibus rem. Tempore quia nam sunt a culpa molestiae dolorem?
      Voluptatibus, similique! Illo perspiciatis corrupti corporis odio
      voluptas, dolore adipisci?
    </p>
  </body>
</html>
