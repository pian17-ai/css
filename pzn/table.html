<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Table</title>
    <style>
      table, tr, th, td {
        width: 200px;
        height: 50px;
        border: 2px solid;
        border-collapse: collapse;
      }

      td {
        text-align: right;
      }

      td:hover {
        background-color: gray;
        color: white;
        border: 2px solid;
      }
    </style>
  </head>

  <body>
    <table>
      <thead>
        <tr>
          <th>No</th>
          <th>Name</th>
          <th>Color Hair</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>1</td>
          <td>Yui Hirasawa</td>
          <td>Brown</td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
