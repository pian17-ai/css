<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layer</title>
    <style>
        @layer b, a;

        h1 {
           text-align: center;
        }

        @layer a {
            h1 {
                color: aqua;
            }
        }

        @layer b {
            h1 {
                color: teal;
            }
        }
    </style>
</head>
<body>
    <h1>Kella</h1>
</body>
</html>
